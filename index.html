<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Farra ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #18052e, #53145f, #150522);
      overflow: hidden;
    }

    .container {
      padding: 25px;
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    h1 {
      color: #ffb6e6;
      text-shadow: 0 0 15px #ff1493;
    }

    p {
      line-height: 1.8;
      color: #ffe5f5;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(45deg, #ff1493, #a855f7);
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 25px #ff1493;
    }

    button:hover {
      transform: scale(1.08);
    }

    #surprise {
      display: none;
    }

    canvas {
      width: 100%;
      max-width: 350px;
      height: auto;
    }

    .floating-heart {
      position: fixed;
      bottom: -40px;
      animation: floatUp 5s linear forwards;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="opening">
      <h1>Hey, Farra! ❤️</h1>
      <p>Aku punya sesuatu spesial buat kamu...</p>
      <p>Are you ready for a little surprise? ✨</p>
      <br>
      <button onclick="openSurprise()">Click Me ❤️</button>
    </div>

    <div id="surprise">
      <h1>For You, Farra 💖</h1>
      <canvas id="heart" width="400" height="350"></canvas>
      <p>You make my world more beautiful. ❤️</p>
      <p>I'm so lucky to have you in my world. 🌷</p>
      <p>With love, always. 💕</p>
    </div>
  </div>

  <script>
    function openSurprise() {
      document.getElementById("opening").style.display = "none";
      document.getElementById("surprise").style.display = "block";

      for (let i = 0; i < 35; i++) {
        setTimeout(createHeart, i * 120);
      }

      animateHeart();
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = ["💖", "💕", "💗", "❤️"][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 20 + Math.random() * 20 + "px";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 5000);
    }

    function animateHeart() {
      const canvas = document.getElementById("heart");
      const ctx = canvas.getContext("2d");
      let time = 0;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        time += 0.04;

        const points = [];

        for (let i = 0; i < 1200; i++) {
          const t = Math.random() * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y = -(13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t));

          points.push({ x, y, hue: i % 360 });
        }

        const scale = 8 + Math.sin(time) * 0.4;

        points.forEach(point => {
          ctx.beginPath();
          ctx.arc(
            200 + point.x * scale,
            165 + point.y * scale,
            1.7,
            0,
            Math.PI * 2
          );

          ctx.fillStyle = `hsl(${(point.hue + time * 30) % 360}, 100%, 65%)`;
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }

      draw();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Farra ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #25103f, #080313 75%);
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    position: relative;
}

canvas {
    width: min(90vw, 500px);
    height: min(90vw, 500px);
    display: block;
}

h1 {
    color: white;
    font-size: clamp(24px, 5vw, 38px);
    margin-top: -35px;
    text-shadow: 0 0 15px #ff65d4;
    animation: glow 2s infinite alternate;
}

p {
    color: #ffc9ee;
    margin-top: 12px;
    font-size: 16px;
}

@keyframes glow {
    from { text-shadow: 0 0 8px #ff65d4; }
    to { text-shadow: 0 0 25px #ff1493, 0 0 40px #a855f7; }
}
</style>
</head>

<body>
<div class="container">
    <canvas id="heart"></canvas>
    <h1>For Farra ❤️</h1>
    <p>You make my world more beautiful ✨</p>
</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const size = 600;
canvas.width = size;
canvas.height = size;

let particles = [];

function heart(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t) - 5 * Math.cos(2*t)
             - 2 * Math.cos(3*t) - Math.cos(4*t))
    };
}

for (let i = 0; i < 1800; i++) {
    const t = Math.random() * Math.PI * 2;
    const point = heart(t);
    const scale = 12 + Math.random() * 5;

    particles.push({
        x: size / 2 + point.x * scale,
        y: size / 2 + point.y * scale,
        hue: Math.random() * 360,
        radius: Math.random() * 2 + 0.6,
        phase: Math.random() * Math.PI * 2
    });
}

let time = 0;

function animate() {
    ctx.clearRect(0, 0, size, size);
    time += 0.025;

    const pulse = 1 + Math.sin(time * 2) * 0.035;

    particles.forEach(p => {
        const brightness = 0.65 + 0.35 *
            Math.sin(time * 3 + p.phase);

        ctx.beginPath();
        ctx.arc(
            size / 2 + (p.x - size / 2) * pulse,
            size / 2 + (p.y - size / 2) * pulse,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = `hsla(${(p.hue + time * 25) % 360},
            100%, 65%, ${brightness})`;

        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fill();
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
